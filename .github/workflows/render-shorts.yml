name: render-shorts

# Renders the remaining frames of both shorts in parallel slices on GitHub-hosted runners
# (the thread sandbox has 2 CPUs and only renders while a session is active).
# Each slice uploads a near-lossless video chunk; assembly happens in the workspace.
on:
  push:
    branches: [hoplite/pellene-a5d2a0f8]
    paths: [.github/workflows/render-shorts.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-shorts
  cancel-in-progress: true

env:
  BLENDER_VERSION: "5.2.4"
  KYLO_SHA: 0c7f8743812636c72b033ffb0a71454f2180ab6a   # kylo-3d-shorts 1.3.1
  LIBS: libegl1 libegl-mesa0 libgl1-mesa-dri libgl1 libglx-mesa0 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6

jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq $LIBS > /dev/null
      - name: Blender and the kylo-3d-shorts plugin
        run: |
          mkdir -p ~/dl ~/blender
          curl -sSfL -o ~/dl/blender.tar.xz \
            "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xJf ~/dl/blender.tar.xz -C ~/blender --strip-components=1
          git clone -q https://github.com/Hitid123/kylo-3d-shorts.git ~/kylo
          git -C ~/kylo checkout -q "$KYLO_SHA"
      - name: Build both scenes once (downloads the Poly Haven assets every slice must share)
        run: |
          export KYLO_SCRIPTS=$HOME/kylo/skills/3d-short/scripts
          for p in messi-vs-ronaldo gagarin-7-facts; do
            ~/blender/blender -b --python "shorts/$p/build.py" -- "shorts/$p" build > "build-$p.log" 2>&1 \
              || { tail -60 "build-$p.log"; exit 1; }
            if grep -q unavailable "build-$p.log"; then grep unavailable "build-$p.log"; exit 1; fi
            grep -E "QA:" "build-$p.log"
          done
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/dl
            ~/kylo
            ~/.cache/kylo-3d-shorts
          key: render-env-${{ github.run_id }}

  render:
    needs: prep
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { p: messi-vs-ronaldo, s: 259, e: 404 }
          - { p: messi-vs-ronaldo, s: 405, e: 550 }
          - { p: messi-vs-ronaldo, s: 551, e: 696 }
          - { p: messi-vs-ronaldo, s: 697, e: 842 }
          - { p: messi-vs-ronaldo, s: 843, e: 988 }
          - { p: messi-vs-ronaldo, s: 989, e: 1134 }
          - { p: messi-vs-ronaldo, s: 1135, e: 1280 }
          - { p: messi-vs-ronaldo, s: 1281, e: 1426 }
          - { p: messi-vs-ronaldo, s: 1427, e: 1572 }
          - { p: gagarin-7-facts, s: 1, e: 122 }
          - { p: gagarin-7-facts, s: 123, e: 244 }
          - { p: gagarin-7-facts, s: 245, e: 366 }
          - { p: gagarin-7-facts, s: 367, e: 488 }
          - { p: gagarin-7-facts, s: 489, e: 610 }
          - { p: gagarin-7-facts, s: 611, e: 732 }
          - { p: gagarin-7-facts, s: 733, e: 854 }
          - { p: gagarin-7-facts, s: 855, e: 976 }
          - { p: gagarin-7-facts, s: 977, e: 1098 }
          - { p: gagarin-7-facts, s: 1099, e: 1220 }
          - { p: gagarin-7-facts, s: 1221, e: 1342 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/dl
            ~/kylo
            ~/.cache/kylo-3d-shorts
          key: render-env-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq $LIBS ffmpeg > /dev/null
          mkdir -p ~/blender
          tar -xJf ~/dl/blender.tar.xz -C ~/blender --strip-components=1
      - name: Render frames ${{ matrix.s }}-${{ matrix.e }}
        working-directory: shorts/${{ matrix.p }}
        env:
          S3D_START: ${{ matrix.s }}
          S3D_END: ${{ matrix.e }}
        run: |
          export KYLO_SCRIPTS=$HOME/kylo/skills/3d-short/scripts
          ~/blender/blender -b --python build.py -- . full > render.log 2>&1 || { tail -80 render.log; exit 1; }
          if grep -q unavailable render.log; then grep unavailable render.log; exit 1; fi
          n=$(find frames -name 'f*.png' -size +0 | wc -l)
          echo "rendered $n frames"
          test "$n" -eq $(( S3D_END - S3D_START + 1 ))
      - name: Encode chunk
        working-directory: shorts/${{ matrix.p }}
        run: |
          ffmpeg -v error -framerate 24 -start_number ${{ matrix.s }} -i frames/f%04d.png \
            -frames:v $(( ${{ matrix.e }} - ${{ matrix.s }} + 1 )) \
            -c:v libx264 -crf 10 -preset fast -pix_fmt yuv444p chunk.mp4
          ls -la chunk.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.p }}-${{ matrix.s }}
          path: |
            shorts/${{ matrix.p }}/chunk.mp4
            shorts/${{ matrix.p }}/render.sfx.json
          retention-days: 3
          compression-level: 0
